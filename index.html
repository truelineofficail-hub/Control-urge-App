const picCtl=()=>{const g=S.gender==='Girl'?'Girl':'Boy';return `<p class="s" style="margin:16px 0 6px">Your own picture (${g})</p><label class="btn ghost" style="display:block;text-align:center;cursor:pointer">${S.pic[g]?'Change picture':'Choose a picture'}<input type="file" accept="image/*" hidden onchange="pickPic('${g}',this)"></label>${S.pic[g]?`<button class="btn lite" onclick="S.pic['${g}']='';save();render()">Remove picture</button>`:''}<p class="s" style="font-size:12px">Stays on this device. Use a picture you have the right to use.</p>`};
function pickPic(g,inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),n=200,m=Math.min(im.width,im.height);c.width=c.height=n;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)*.2,m,m,0,0,n,n);S.pic[g]=c.toDataURL('image/jpeg',.85);save();render()};im.src=r.result};r.readAsDataURL(f)}
let T=null;const stop=()=>{clearInterval(T);T=null};
const TABS=['home','reset','learn','profile'];
const URGE=['checkin','pause','trigger','env','activity','timer','reassess','still','success'];

const xbar=()=>`<div class="top"><button class="ic" aria-label="Leave" onclick="askExit()">✕</button><span class="s" style="font-size:12px;color:var(--mut)">${{pause:'Pause',trigger:'Trigger',env:'Environment',activity:'Reset',timer:'Reset',checkin:'Check-in',reassess:'Check-in',still:'Check-in'}[S.scr]||''}</span></div>`;
function go(s){stop();S.scr=s;if(s==='splash')setTimeout(()=>S.scr==='splash'&&go('welcome'),1800);render(true)}
function render(a){
  const s=S.scr,R=V[s](),st=$('app').scrollTop;$('app').className=a?'in':'';$('app').innerHTML=R;if(s==='pause')S.u.ph=-1;

}
function tog(arr,v,scr){const i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1);render()}
const modal=(t,b,bs)=>{$('modal').innerHTML=`<div class="modal"><div class="b"><h2>${t}</h2><p class="s">${b}</p>${bs.map(x=>btn(x[0],x[1],x[2]||'')).join('')}</div></div>`};
const closeM=()=>$('modal').innerHTML='';
function askExit(){modal('Leave Control Mode?',"Your current session won't be counted as a failure.",[['Stay','closeM()'],['Leave','closeM();leave()','ghost']])}
function leave(){rec('left');stop();S.incomplete=true;S.u.run=false;go('home')}
const fmt=n=>Math.floor(n/60)+':'+String(n%60).padStart(2,'0');
const ring=(p,c)=>`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="var(--line)" stroke-width="3"/><circle id="arc" cx="50" cy="50" r="46" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="${289*(1-p)}"/></svg>`;
function startTimer(sec,done){stop();S.u.ph=-1;S.u.left=sec;S.u.total=sec;S.u.run=true;S.u.done=done;render();T=setInterval(()=>{if(S.u.run)S.u.left--;if(S.u.left<=0){stop();S.u.left=0;S.u.run=false;render();return}upd()},1000)}
function upd(){const t=$('tm'),a=$('arc'),p=$('ph'),gd=$('gd');if(t)t.textContent=fmt(S.u.left);if(a)a.setAttribute('stroke-dashoffset',289*(S.u.left/S.u.total));if(p&&S.scr==='pause')breath(p);if(gd&&S.scr==='pause')gd.textContent=GUIDE()[Math.floor((S.u.total-S.u.left)/9)%6]}
function skip(){S.u.left=Math.min(S.u.left,2);upd()}
function startUrge(){S.u={int:5,trg:[],act:null,step:0,left:0,total:0,run:false,envi:0,active:true};S.incomplete=false;go('checkin')}
function afterCheckin(){goPause()}
const ENV={'Seeing something sexual':['Close the triggering content.','Put your phone away.','Move somewhere different.'],'Lying in bed':['Get out of bed.','Go to another room.','Do something standing up.'],'Boredom':['Stand up.','Choose an activity.','Move for a few minutes.'],'Stress':['Take several slow breaths.','Relax your shoulders.','Walk or stretch.'],'Late night':['Leave the screen.','Get out of bed briefly.','Prepare for sleep.'],'Feeling lonely':['Stand up and stretch.','Open a window or step outside.','Text someone you trust, or just walk.'],'Being alone':['Move to a shared or bright space.','Turn on some music.','Stand up and walk.'],'Random urge':['Stand up.',"Put your phone somewhere you can't easily reach.",'Walk to another room.'],'Other':['Stand up and move to another room.','Put your phone out of reach.','Take a few steps away.']};
function envTasks(){let t=[];(S.u.trg.length?S.u.trg:['Other']).forEach(k=>(ENV[k]||[]).forEach(x=>{if(!t.includes(x))t.push(x)}));return t.slice(0,3)}
const ACT={Move:[['20 squats','5–10 min'],['Walk around','10 min'],['Stretch','5–10 min'],['Quick workout','10 min']],Relax:[['Breathing','5 min'],['Wash your face','5 min'],['Drink water','2 min'],['Shower','10 min']],Focus:[['Read','10 min'],['Draw','10 min'],['Code','10 min'],['Clean your room','10 min'],['Listen to music','10 min']],Other:[['Call a friend','10 min'],['Go outside','10 min']]};
let cat='Move';
const ART={'Why do urges feel so strong?':['An urge is a signal, not an order.','Urges build fast and peak, usually within minutes. Your brain is chasing a quick reward.','Waiting makes it weaker. Each time you let one pass, the next has less pull.','Do something physical. Movement uses the same energy the urge is asking for.','An urge is a feeling. It does not have to become an action.'],'What triggers sexual thoughts?':['Triggers are cues your brain has linked to the urge.','Common ones: seeing content, lying in bed, boredom, loneliness and stress.','Cues repeat, so the habit loop repeats.','Notice which cue came first. Write it in your journal.','Knowing your trigger lets you plan for it.'],'Why does boredom make urges stronger?':['Boredom leaves space, and the brain fills it with quick rewards.','With nothing to focus on, urges are louder.','A planned activity beats waiting to feel motivated.','Keep a short list: walk, draw, read, music.','Choose an activity before you get bored.'],'Why can late nights be difficult?':['Tired brains have less self-control.','Late night means low energy, low willpower and a phone in your hand.','Screens keep you awake and cues nearby.','Charge your phone outside your bed. Get up if you feel restless.','Sleep is part of self-control.'],'What can I do when an urge appears?':['Pause, change your environment, do something else for 10 minutes.','Pause first. Two minutes without decisions.','Change what is around you: stand, move, put the phone away.','Choose one activity and give it 10 minutes.','Then check in. Still strong? Try another round.'],'How can I build better habits?':['Small, repeatable actions beat big promises.','Attach a new action to an existing cue.','Keep it easy: two minutes is enough to start.','Notice progress in how you respond, not in a streak.','Be kind to yourself when it goes badly.']};
ART['Communication']=['Clear, kind words make closeness easier.','Say what you feel and need, using "I" statements.','Being heard lowers stress for both of you.','Pick a calm time. Say one thing you appreciate, then one thing you need.','Talk about needs early, not after things go wrong.'];
ART['Healthy Boundaries']=['Boundaries are about what you are comfortable with.','They cover time, space, phones and privacy.','Clear limits build trust and reduce pressure.','Decide one limit and tell your partner kindly.','You can change a boundary at any time.'];
ART['Relationship Goals']=['Shared goals keep a relationship steady.','Think about time together, habits and support.','Goals that both people choose last longer.','Write one small goal you both want this month.','Small shared habits beat big promises.'];
ART['Shared Activities']=['Doing things together builds connection without pressure.','Walks, cooking, games, music and workouts all count.','Shared time gives you both something to enjoy besides screens.','Plan one activity this week and put phones away.','Closeness grows from ordinary time together.'];
const Q=(k)=>`<div class="c" style="margin-top:34px"><p class="s">${k}</p></div>`;
const V={
splash:()=>`<div class="sp"></div><div class="c"><div style="font-size:34px;color:var(--sage)">❦</div><div class="logo" style="margin-top:14px">${LG()}</div><p class="s" style="margin-top:20px">A calmer mind.<br>A stronger you.</p></div><div class="sp"></div>`,
welcome:()=>`<div class="sp"></div><div class="c">${heroW()}<div class="logo">${LG()}</div><p class="s" style="margin-top:20px">A calmer mind.<br>A stronger you.</p><p style="margin-top:36px;font-size:15px">Take control of your urges.</p></div><div class="sp"></div>${btn('Continue →',"go('gender')")}`,
gender:()=>`${back("go('welcome')")}<h1>Choose yourself</h1><p class="s">This helps us give you a better experience.</p><div class="sp" style="max-height:20px"></div>${['Boy','Girl'].map(g=>`<button class="card sel ${S.gender===g?'on':''}" style="display:flex;align-items:center;gap:20px;padding:18px" onclick="S.gender='${g}';render()">${g==='Boy'?boy(84):girl(84)}<b style="font-size:19px">${g}</b></button>`).join('')}<div class="sp"></div><button class="btn" ${S.gender?'':'disabled'} onclick="go('mode')">Continue →</button>`,
mode:()=>`${back("go('gender')")}<h1>How are you approaching this?</h1><p class="s">Choose what fits you right now. You can change this later.</p>${[['Single','For your personal journey.'],['Mingle','For healthier relationship habits.']].map(m=>`<button class="card sel ic2 ${S.mode===m[0]?'on':''}" style="padding:24px" onclick="S.mode='${m[0]}';render()"><i class="tile">${m[0]==='Single'?'🌿':'💞'}</i><div><b>${m[0]}</b><span>${m[1]}</span></div></button>`).join('')}<div class="sp"></div><button class="btn" ${S.mode?'':'disabled'} onclick="go('goals')">Continue →</button>`,
goals:()=>`${back("go('mode')")}<h1>What do you need help with?</h1><p class="s">You can choose more than one.</p>${['Control sexual urges','Understand my triggers','Calm myself','Build healthier habits'].map(g=>`<button class="card sel ic2 ${S.goals.includes(g)?'on':''}" onclick="tog(S.goals,'${g}')"><i class="tile">${GI[g]}</i><div><b>${g}</b></div></button>`).join('')}<div class="sp"></div><button class="btn" ${S.goals.length?'':'disabled'} onclick="S.ob=true;save();go('home')">Get Started →</button>`,
home:()=>{const m=S.incomplete?`<div class="card" style="margin:0 0 12px"><b>You can come back whenever you need to.</b>${btn('Continue Reset','startUrge()')}${btn('Back Home',"S.incomplete=false;render()",'ghost')}</div>`:S.returning?`<div class="card" style="margin:0 0 12px"><b>Welcome back.</b><span>You handled a difficult moment.</span></div>`:'';return `<div class="top"><span class="logo" style="font-size:14px">${LG()}</span><button class="ic" style="padding:0" onclick="go('profile')" aria-label="Profile">${av(40)}</button></div>${since()}${scene()}<div class="sp" style="max-height:6px"></div>${m}<div class="card" style="padding:22px"><h2 style="font-size:18px">Feeling a strong urge right now?</h2><p class="s">Take a deep breath. Let's get through this together.</p>${btn('🔥 I\'m having an urge','startUrge()','urge')}${btn('Very strong? Start pause now','quickUrge()','ghost')}${btn('I just want to understand',"go('learn')",'ghost')}</div>${moodCard()}${refCard()}${rmCard()}${tipCard()}<button class="card" onclick="go('plan')"><b>Gradual plan</b><span>${planLine()}</span></button>${toolsGrid()}${statRow()}`},
reset:()=>`<h1>Reset</h1><p class="s">Tools you can use any time.</p>${[['Breathing','Two minutes, no decisions.',"startUrge2('pause')"],['10-Minute Reset','Pick something and give it 10 minutes.',"startUrge2('activity')"],['Change Environment','A small physical change breaks the loop.',"startUrge2('env')"],['Quick Walk','Walk for a few minutes.',"S.u.act='Walk around';startUrge2('timer')"],['Night plan','Wind down before bed.',"go('night')"],['Calming gestures','Ideas that fit you. Two minutes each.',"go('gest')"],].map(c=>`<button class="card ic2" onclick="${c[2]}"><i class="tile">${RI[c[0]]||'✨'}</i><div><b>${c[0]}</b><span>${c[1]}</span></div></button>`).join('')}<div class="sp"></div>${btn('🔥 I\'m having an urge','startUrge()','urge')}`,
learn:()=>`<h1>Understand Your Urges</h1><p class="s">Knowledge gives you power.</p>${LEARN().map((t,i)=>`<button class="card ic2" onclick="S.art='${t.replace(/'/g,"\\'")}';S.artBack='learn';go('article')"><i class="tile">${ARI[t]||'🌿'}</i><div><b>${t}</b><span>2 min read</span></div></button>`).join('')}`,
article:()=>{const a=ART[S.art];return `${back("go(S.artBack||'learn')")}<div class="hero3">${ARI[S.art]||'🌿'}</div><h1>${S.art}</h1><p class="s" style="font-size:15px;color:var(--ink)">${a[0]}</p>${['What happens','Why it matters','What to try'].map((h,i)=>`<h2 style="font-size:16px;margin-top:22px">${h}</h2><p class="s" style="font-size:14px">${a[i+1]}</p>`).join('')}<div class="card" style="background:var(--hi)"><b>Key takeaway</b><span style="color:var(--ink)">${a[4]}</span></div><div class="sp"></div>${btn('Done',"artDone()")}`},
articleDone:()=>`<div class="sp"></div><div class="c"><h1>You've got it.</h1><p class="s">One useful idea can change what you do next time.</p></div><div class="sp"></div>${btn('Back to Learn',"go('learn')")}${btn('Try a Reset','startUrge()','ghost')}`,
profile:()=>{const row=(t,v,f)=>`<button class="card ic2" style="padding:14px 16px" onclick="${f}"><i class="tile">${PI[t]||'🧭'}</i><div><b>${t}</b>${v?`<span>${v}</span>`:''}</div></button>`;return `<div style="display:flex;align-items:center;gap:16px;margin-bottom:6px">${av(68)}<div><h1>Profile</h1><p class="s" style="margin:2px 0 0">${S.gender||''} · ${S.mode||''}</p></div></div>${row('Preferences',[S.gender,S.mode,S.goals.length+' goals'].join(' · '),"go('prefs')")}${row(S.mode+' space','Open your '+S.mode+' page',"go('modehome')")}${row('Journal','Private notes on your device',"go('journal')")}${row('Gradual plan',planLine(),"go('plan')")}${row('Progress','This week and badges',"go('progress')")}${row('Weekly reflection','Three short questions',"go('reflect')")}${row('If-then plans','Plan ahead for each trigger',"go('ifthen')")}${row('Trusted contact',S.tc.p?(S.tc.n||S.tc.p):'Add someone to call',"go('contact')")}${row('Insights','Your triggers and times',"go('insights')")}${row('App lock',S.pin?'On':'Off',S.pin?"offPin()":"S.pb='';S.pt=null;S.pe=0;go('pinset')")}${row('Discreet mode',S.disc?'On: shows Notes and hides content when you switch apps':'Off',"S.disc=!S.disc;save();setDisc();render()")}${row('Reminders',S.reminders?'On: evening check-in after 8 pm':'Off',"S.reminders=!S.reminders;save();render()")}${row('Privacy','What is stored and where',"go('privacy')")}${row('About CONTROL','An urge is a feeling. A feeling does not have to become an automatic action.',"")}`},
plan:()=>{const P=S.plan,g=STG[P.stage],u=used();return `${back("go('home')")}<h1>Gradual plan</h1><p class="s">Ease down at your own pace. There are no streaks, and going back a step is always fine.</p>${STG.map((x,i)=>`<button class="card ${P.on&&P.stage===i?'on':''}" style="padding:14px 16px" onclick="pickStage(${i})"><b>Step ${i+1} <span class="toggle">${P.on&&P.stage===i?'Current':''}</span></b><span style="font-size:14px;color:var(--ink)">${x[2]}</span></button>`).join('')}${P.on?`<div class="card" style="margin-top:14px"><b>This period: ${u} of ${g[0]}</b><div style="display:flex;gap:8px;margin:12px 0">${Array.from({length:Math.max(g[0],u)},(_,i)=>`<span style="width:16px;height:16px;border-radius:50%;background:${i<u?'var(--sage)':'var(--line)'}"></span>`).join('')}</div><span>Only you can see this, and it stays on your device.</span>${btn('Log one',"logPlan()",'ghost')}${P.log.length?`<button class="btn lite" onclick="undoPlan()">Undo last</button>`:''}</div><div class="card"><b>Ready for the next step?</b><span>When the current step has felt steady for about 2 weeks, tap the next step. Not ready? Stay put.</span></div>`:`<p class="s" style="margin-top:14px">Tap the step you want to start with.</p>`}<div class="card"><b>When you feel the pull</b><span>Take a warm shower. Rest one hand on your chest and breathe slowly. Hug a pillow, stretch, or walk to another room.</span></div><div class="sp"></div>${btn('🔥 I\'m having an urge','startUrge()','urge')}`},
gest:()=>`${back("go('reset')")}<h1>Calming gestures</h1><p class="s">Small actions that give your body something else to do. 2 minutes each.</p><div class="chips">${['For you','Calm','Move','Connect'].map(c=>`<button class="chip ${c===gtab?'on':''}" onclick="gtab='${c}';render()">${c}</button>`).join('')}</div>${gList().map((g,i)=>`<button class="card ic2" style="padding:14px 16px" onclick="openG(${i})"><i class="tile">${{Calm:'🌿',Move:'🏃',Connect:'💬'}[gtab]||(S.gender==='Girl'?'🌸':'💪')}</i><div><b>${S.fav.includes(g[0])?'★ ':''}${g[0]}</b><span>${g[1]}</span></div></button>`).join('')}`,
lock:()=>kp('Enter your PIN','Your notes are private.'),
pinset:()=>back("go('profile')")+kp(S.pt?'Enter it again':'Set a 4-digit PIN','Choose a PIN you will remember.'),
insights:()=>{const A=S.sess,bk=back("go('profile')");if(!A.length)return bk+'<h1>Insights</h1><div class="card c" style="padding:30px 16px"><b>No sessions yet.</b><span>Insights come from what you log in Control Mode.</span></div>';const tc={};A.forEach(x=>x.g.forEach(t=>tc[t]=(tc[t]||0)+1));const tr=Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,5),mx=tr[0]?tr[0][1]:1;const B=[['Morning',5,11],['Afternoon',12,16],['Evening',17,21],['Night',22,4]].map(([n,a,b])=>[n,A.filter(x=>a<=b?x.h>=a&&x.h<=b:(x.h>=a||x.h<=b)).length]),bm=Math.max(...B.map(x=>x[1]));const avg=(A.reduce((t,x)=>t+x.i,0)/A.length).toFixed(1),ok=A.filter(x=>x.r==='okay').length;return `${bk}<h1>Insights</h1><p class="s">Based only on your own sessions, kept on this device.</p><div class="card"><b>${A.length} session${A.length>1?'s':''}</b><span>Average urge level ${avg}. You got through ${ok}.</span></div><div class="card"><b>Common triggers</b>${tr.length?tr.map(t=>bar(t[0],t[1],mx)).join(''):'<span>No triggers logged yet.</span>'}</div><div class="card"><b>Time of day</b>${B.map(b=>bar(b[0],b[1],bm)).join('')}</div>${S.moods.length?`<div class="card"><b>Mood check-ins</b><span>${S.moods.length} logged. Average ${(S.moods.reduce((t,x)=>t+x.m+1,0)/S.moods.length).toFixed(1)} of 5.</span></div>`:''}<div class="card" style="background:var(--hi)"><b>Plan for it</b><span>${tr[0]?'Your most common trigger is "'+tr[0][0]+'". Try a gesture or reset before it builds.':'Log triggers to see patterns.'}</span></div>`},
night:()=>`${back("go('reset')")}<h1>Night plan</h1><p class="s">A calm end to the day lowers late-night urges.</p>${NIGHT.map((x,i)=>`<button class="card ${S.nc.includes(i)?'on':''}" style="padding:14px 16px" onclick="tog(S.nc,${i})"><b>${S.nc.includes(i)?'✓ ':''}${x}</b></button>`).join('')}<div class="sp"></div>${btn('Start 5-minute wind-down',"S.u.act='Wind-down';S.u.total=0;go('timer');startTimer(300)")}${btn('Breathe first',"startUrge2('pause')",'ghost')}`,
ifthen:()=>`${back("go('profile')")}<h1>If-then plans</h1><p class="s">Decide now what you will do when a trigger shows up.</p>${TRG().map((k,i)=>`<p class="s" style="margin:14px 0 4px">If: ${k}</p><input class="fld" value="${(S.ifs[k]||'').replace(/"/g,'&quot;')}" placeholder="then I will…" oninput="S.ifs[TRG()[${i}]]=this.value;save()">`).join('')}`,
contact:()=>`${back("go('profile')")}<h1>Trusted contact</h1><p class="s">Someone you can call or message when it is hard. Stays on this device.</p><p class="s" style="margin:16px 0 4px">Name</p><input class="fld" value="${S.tc.n}" oninput="S.tc.n=this.value;save()"><p class="s" style="margin:16px 0 4px">Phone</p><input class="fld" type="tel" value="${S.tc.p}" oninput="S.tc.p=this.value;save()">`,
reflect:()=>`${back("go('profile')")}<h1>Weekly reflection</h1>${['What went well this week?','What was hardest?','One thing to try next week'].map((q,i)=>`<p class="s" style="margin-bottom:0">${q}</p><textarea id="rf${i}"></textarea>`).join('')}${btn('Save to Journal',"saveRef()")}`,
progress:()=>{const w=S.sess.filter(x=>Date.now()-x.t<6048e5),ok=S.sess.filter(x=>x.r==='okay').length,bd=BADGES.filter(b=>b[1]()),P=S.plan;return `${back("go('profile')")}<h1>Progress</h1><p class="s">Only real activity you have done. No streaks.</p><div class="card"><b>This week</b><span>${w.length} session${w.length===1?'':'s'}, ${w.filter(x=>x.r==='okay').length} got through</span></div><div class="card"><b>Overall</b><span>${S.sess.length} sessions. ${ok} got through. ${S.journal.length} journal notes.</span></div><div class="card"><b>Gradual plan</b><span>${P.on?'Step '+(P.stage+1)+': '+STG[P.stage][2]:'Not started'}</span></div><div class="card"><b>Earned so far</b><div class="chips">${bd.length?bd.map(b=>`<span class="chip on">${b[0]}</span>`).join(''):'<span>Badges appear as you try things.</span>'}</div></div>`},
quiz:()=>{const q=QZ[S.art],a=S.qa!==null;return `${back("go('article')")}<h1>Quick check</h1><p class="s" style="font-size:15px;color:var(--ink)">${q[0]}</p>${q[1].map((o,i)=>`<button class="card" style="padding:14px 16px;${a&&i===q[2]?'border-color:var(--sage);background:var(--hi)':S.qa===i?'border-color:var(--urge)':''}" ${a?'disabled':''} onclick="S.qa=${i};render()"><b>${o}</b></button>`).join('')}${a?`<p class="s">${S.qa===q[2]?'Right.':'Not quite.'} ${q[3]}</p><div class="sp"></div>${btn('Continue',"go('articleDone')")}`:''}`},
prefs:()=>`${back("go('profile')")}<h1>Preferences</h1><div class="c" style="margin:14px 0 4px">${duo(0)}</div>${sw()}${picCtl()}<p class="s" style="margin-top:22px">You</p>${['Boy','Girl'].map(g=>`<button class="card ${S.gender===g?'on':''}" style="display:flex;align-items:center;gap:16px" onclick="S.gender='${g}';save();render()">${g==='Boy'?boy(52):girl(52)}<b>${g}</b></button>`).join('')}<p class="s" style="margin-top:22px">Mode</p>${['Single','Mingle'].map(g=>`<button class="card ${S.mode===g?'on':''}" onclick="S.mode='${g}';save();render()"><b>${g}</b></button>`).join('')}<p class="s" style="margin-top:22px">Goals</p>${['Control sexual urges','Understand my triggers','Calm myself','Build healthier habits'].map(g=>`<button class="card ${S.goals.includes(g)?'on':''}" onclick="tog(S.goals,'${g}');save()"><b>${g}</b></button>`).join('')}`,
privacy:()=>`${back("go('profile')")}<h1>Your privacy matters.</h1><p class="s">CONTROL keeps your personal information private.</p><div class="card"><b>What is stored</b><span>Your preferences and journal notes.</span></div><div class="card"><b>Where</b><span>Only on this device.</span></div><div class="card"><b>Sent online</b><span>Nothing.</span></div><div class="sp"></div>${btn('Reset Personal Data',"modal('Are you sure?','This will delete your preferences, journal entries and local progress. This cannot be undone.',[['Cancel','closeM()','ghost'],['Delete My Data','wipe()']])",'ghost')}`,
modehome:()=>{const s=S.mode==='Single';const c=s?['Urge Control','Trigger Insights','Reset Tools','Personal Goals','Private Journal']:['Communication','Healthy Boundaries','Relationship Goals','Shared Activities','Private Space'];return `${back("go('profile')")}<div style="margin:0 0 16px">${duo(S.mode==='Mingle')}</div><h1>${S.mode}</h1><p class="s">${s?'Your personal self-control journey.':'Stronger habits. Healthier relationships.'}</p>${c.map(x=>`<button class="card ic2" onclick="${MM(x)}"><i class="tile">${MI[x]||'✨'}</i><div><b>${x}</b></div></button>`).join('')}`},
journal:()=>`${back("go('profile')")}<h1>Journal</h1><div class="chips"><span class="chip on">My Notes</span><span class="chip" onclick="go('insights')">Insights</span></div>${S.journal.length?S.journal.map((e,i)=>`<button class="card" onclick="S.det=${i};go('jdetail')"><span style="margin:0 0 4px">${e.d}</span><b>${(e.f||e.w||e.h||'').slice(0,60)}</b></button>`).join('')+'<div class="sp"></div>'+btn('+ New Note',"go('jnew')"):`<div class="card c" style="padding:34px 16px"><div style="font-size:44px;margin-bottom:10px">📓</div><b>Write what you're feeling.</b><span>Your journal is private.</span>${btn('New Note',"go('jnew')")}</div>`}`,
jnew:()=>`${back("go('journal')")}<h1>New note</h1>${[['f','How are you feeling?'],['w','What happened?'],['h','What helped?']].map(x=>`<p class="s" style="margin-bottom:0">${x[1]}</p><textarea id="j${x[0]}">${(S.pre&&S.pre[x[0]])||''}</textarea>`).join('')}${btn('Save Note',"saveNote()")}${btn('Cancel',"S.pre=null;go('journal')",'ghost')}`,
jdetail:()=>{const e=S.journal[S.det];return `${back("go('journal')")}<p class="s" style="margin:0">${e.d}</p><h2 style="margin-top:14px">Feeling</h2><p class="s">${e.f||'—'}</p><h2 style="margin-top:14px">What happened</h2><p class="s">${e.w||'—'}</p><h2 style="margin-top:14px">What helped</h2><p class="s">${e.h||'—'}</p><div class="sp"></div>${btn('Delete',"modal('Delete this note?','',[['Cancel','closeM()','ghost'],['Delete','S.journal.splice(S.det,1);save();closeM();go(\\'journal\\')']])",'ghost')}`},
checkin:()=>`${xbar()}<h1>How strong is the urge right now?</h1><div class="big" id="iv">${S.u.int}</div><input type="range" min="1" max="10" value="${S.u.int}" aria-label="Urge intensity" oninput="S.u.int=+this.value;$('iv').textContent=this.value"><div class="lbl"><span>1 Very mild</span><span>5 Moderate</span><span>10 Very strong</span></div><div class="sp"></div>${btn('Continue',"afterCheckin()")}`,
pause:()=>{const t=S.u.total,r=S.u.left;
if(!t)return `${xbar()}<h1>Let's slow this down</h1><p class="s">${PL()}</p><div class="card" style="background:var(--hi)"><b>Why a pause works</b><span>Urges rise fast, peak, then fall, usually within a few minutes. You are not fighting it or giving in. You are giving it room to pass.</span></div><p class="s" style="margin:16px 0 6px">How long?</p><div class="chips" style="margin:0">${[60,120,180].map(d=>`<button class="chip ${S.pd===d?'on':''}" onclick="S.pd=${d};render()">${d/60} min</button>`).join('')}</div><p class="s" style="margin:14px 0 6px">Breathing style</p><div class="chips" style="margin:0">${BRN.map((b,i)=>`<button class="chip ${S.bs===i?'on':''}" onclick="S.bs=${i};render()">${b[0]}</button>`).join('')}</div><div class="sp"></div>${btn('Start',"startP()")}`;
if(r>0)return `${xbar()}<p class="s c" style="margin:0;min-height:20px" id="gd">${GUIDE()[0]}</p><div class="ring">${ring(r/t,'var(--sage)')}<span class="orb" id="orb"></span><div><b id="tm">${fmt(r)}</b><span class="s" id="ph" style="margin:0">Breathe in…</span></div></div><div class="sp"></div>${btn(S.u.run?'Pause':'Resume',"S.u.run=!S.u.run;render()",'ghost')}`;
return `${xbar()}<h1 class="c">Notice how you feel.</h1><p class="s c">You started at ${S.u.int}/10. How strong is it now?</p><div style="display:flex;gap:10px;margin-top:20px">${[['Lower','lower'],['The same','same'],['Higher','higher']].map(o=>`<button class="chip ${S.u.chg===o[1]?'on':''}" style="flex:1;padding:12px" onclick="S.u.chg='${o[1]}';render()">${o[0]}</button>`).join('')}</div>${S.u.chg?`<div class="card" style="background:var(--hi)"><span style="color:var(--ink)">${CH[S.u.chg]}</span></div>`:''}<div class="sp"></div>${btn('Continue →',"go('trigger')")}`},
trigger:()=>`${xbar()}<h1>What triggered it?</h1><p class="s">Be honest. It helps us give you better advice.</p><div class="grid" style="margin-top:14px">${TRG().map(k=>`<button class="card ${S.u.trg.includes(k)?'on':''}" onclick="tog(S.u.trg,'${k}')">${k}</button>`).join('')}</div><div class="sp"></div>${btn('Next →',"S.u.envi=0;go('env')")}`,
env:()=>{const t=envTasks(),i=S.u.envi,last=i>=t.length-1;return `${xbar()}<h1>Change your environment</h1><p class="s">A small physical change can break an automatic habit loop.</p><div class="card" style="padding:26px 18px;margin-top:22px"><p class="s" style="margin:0 0 6px">Step ${i+1} of ${t.length}</p><h2>${t[i]}</h2></div>${ifCard()}<div class="sp"></div>${btn(last?'Continue':"I've done this",last?"go('activity')":"S.u.envi++;render()")}`},
activity:()=>`${xbar()}<h1>10-Minute Reset</h1><p class="s">Choose something. Give yourself 10 minutes.</p><div class="chips">${Object.keys(AC()).map(c=>`<button class="chip ${c===cat?'on':''}" onclick="cat='${c}';render()">${c}</button>`).join('')}</div>${AC()[cat].slice().sort((a,b)=>(S.rate[b[0]]||0)-(S.rate[a[0]]||0)).map(a=>`<button class="card ${S.u.act===a[0]?'on':''}" style="padding:14px 16px" onclick="S.u.act='${a[0]}';render()"><b>${S.rate[a[0]]?'👍 ':''}${a[0]} <span class="toggle">${a[1]}</span></b></button>`).join('')}<div class="sp"></div><button class="btn" ${S.u.act?'':'disabled'} onclick="go('timer');startTimer(600)">Start Timer (10:00)</button>`,
timer:()=>`${xbar()}<p class="s c" style="margin:0">${S.u.act||'Quick Walk'}</p><div class="ring">${ring(S.u.left/(S.u.total||1),'var(--slate)')}<div><b id="tm">${fmt(S.u.left||600)}</b><span class="s" style="margin:0">Time for yourself.</span></div></div><p class="s c">Take a deep breath. You've got this.</p><div class="sp"></div>${S.u.left>0||!S.u.total?`${S.u.total?btn(S.u.run?'Pause':'Resume',"S.u.run=!S.u.run;render()",'ghost'):btn('Start (10:00)',"startTimer(600)")}${btn('End',"modal('End this activity?','',[['Continue Timer','closeM()'],['End','closeM();go(\\'reassess\\')','ghost']])",'ghost')}`:btn('Continue →',"go('reassess')")}`,
reassess:()=>`${xbar()}<h1>Still feeling it?</h1><p class="s">That's okay. You're not failing.</p><button class="card" style="background:var(--urge);color:#fff;border:0;margin-top:22px" onclick="go('still')"><b>🔥 Yes, it's still strong</b><span style="color:#ffe0e0">Let's try another round.</span></button><button class="card" onclick="okayDone()"><b>🌿 No, I'm okay</b><span>Be proud of yourself.</span></button>${Q("Progress isn't about never feeling urges. It's about learning what to do when one appears.")}<div class="sp"></div>${btn('Return Home',"leave()",'lite')}`,
still:()=>`${xbar()}<h1>The urge is still strong.</h1><p class="s">You don't have to act on it. Let's try another approach.</p>${[STILLX(),['Try another activity',"S.u.act=null;go('activity')"],['Change location',"S.u.envi=0;go('env')"],['Breathing exercise',"goPause()"],['Try a calming gesture',"go('gest')"],['Take another 10-minute reset',"go('timer');startTimer(600)"]].map(o=>`<button class="card" onclick="${o[1]}"><b>${o[0]}</b></button>`).join('')}${tcBtn()}<div class="sp"></div>${btn('Return Home',"leave()",'lite')}`,
success:()=>`<div class="sp"></div><div class="c"><div class="pop" style="display:flex;justify-content:center">${av(104)}</div><h1 style="margin-top:18px">You did it.</h1><p class="s">Not because it was easy, but because you chose yourself.</p><p class="s" style="margin-top:22px">Progress isn't about never feeling an urge. It's about learning what to do when one appears.</p></div><div class="sp"></div>${rateCard()}${btn('Back to Home',"S.returning=true;go('home')")}${btn('Add to Journal',"go('jnew')",'ghost')}`
};
function startUrge2(s){S.u.trg=[];S.u.envi=0;S.u.total=0;if(s==='pause'){goPause();return}go(s)}
function saveNote(){const g=k=>$('j'+k).value.trim();const e={f:g('f'),w:g('w'),h:g('h'),d:new Date().toLocaleDateString(undefined,{month:'short',day:'numeric'})};S.pre=null;if(e.f||e.w||e.h){S.journal.unshift(e);save()}go('journal')}
function cycleTheme(){S.theme={auto:'light',light:'dark',dark:'auto'}[S.theme];const r=document.documentElement;S.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.theme);render()}
function wipe(){S.ob=false;S.gender=S.mode=null;S.goals=[];S.journal=[];S.plan={on:false,stage:0,log:[]};S.sess=[];S.fav=[];S.pin=null;S.disc=false;S.ifs={};S.rate={};S.moods=[];S.tc={n:'',p:''};S.read=0;S.rk='';S.pic={Boy:'',Girl:''};setDisc();save();closeM();go('welcome')}
const G=()=>S.gender==='Girl'?'Girl':'Boy';
const TRG=()=>G()==='Girl'?['Feeling lonely','Stress or anxiety','Emotional low','Hormonal changes','Lying in bed','Late night','Social media','Random urge','Other']:['Seeing something sexual','Lying in bed','Boredom','Late night','Being alone','Gaming or scrolling','Excess energy','Random urge','Other'];
Object.assign(ENV,{'Gaming or scrolling':['Close the app or game.','Put your phone in another room.','Stand up and do 10 squats.'],'Excess energy':['Stand up now.','Do 20 jumping jacks or push-ups.','Take a fast walk outside.'],'Stress or anxiety':['Drop your shoulders and unclench your jaw.','Take 5 slow breaths, out longer than in.','Walk to a window or step outside.'],'Emotional low':['Wrap yourself in a blanket or a cozy layer.','Drink something warm.','Message someone or play a comforting song.'],'Hormonal changes':['Drink water and eat something small.','Take a warm shower or stretch gently.','Remind yourself: this feeling rises and passes.'],'Social media':['Close the app.','Put your phone face-down in another room.','Do something with your hands: draw, tidy or cook.']});
const ACTG={Boy:{Move:[['20 push-ups','5 min'],['Run or jog','10 min'],['Quick workout','10 min'],['Shadow boxing','5 min']],Relax:[['Breathing','5 min'],['Wash your face','5 min'],['Drink water','2 min'],['Hot shower','10 min']],Focus:[['Read','10 min'],['Code','10 min'],['Build or fix something','10 min'],['Clean your room','10 min'],['Listen to music','10 min']],Other:[['Call a friend','10 min'],['Go outside','10 min']]},Girl:{Move:[['Gentle yoga','10 min'],['Dance to a song','5 min'],['Walk outside','10 min'],['Stretch','5 min']],Relax:[['Warm shower','10 min'],['Skincare','10 min'],['Warm tea','5 min'],['Breathing','5 min']],Focus:[['Journal','10 min'],['Draw or paint','10 min'],['Read','10 min'],['Bake or cook','10 min'],['Listen to music','10 min']],Other:[['Call a friend','10 min'],['Face mask and a show','10 min']]}};
const AC=()=>ACTG[G()];
const TIPG={Boy:['Burn off energy: do 20 push-ups or a fast walk today.','Keep your phone out of reach when you are bored.','Plan a workout for the time you usually feel restless.','Charge your phone outside your bedroom tonight.','Get outside for 10 minutes of sunlight.','Keep your hands busy: fix, build or tidy something.','Sleep well. Tired brains have weaker self-control.','Close the tabs and apps that pull you in.','Text a friend and make a plan for the weekend.','Take five slow breaths before you open your phone.'],Girl:['Check in with how you feel before you open your phone.','Keep a warm drink and a blanket ready for low moments.','Notice how your mood shifts across the month. It helps you plan.','Message someone when you feel lonely instead of scrolling.','Try five minutes of gentle stretching tonight.','Write down one thing you are proud of today.','Charge your phone away from your bed.','Take a warm shower before bed.','Listen to one song that calms you.','Take five slow breaths, out longer than in.']};
const TP=()=>TIPG[G()];
const LEARN=()=>G()==='Girl'?['Why do urges feel so strong?','Emotions and urges','Hormones and urges','Loneliness and comfort','Why can late nights be difficult?','How can I build better habits?']:['Why do urges feel so strong?','What triggers sexual thoughts?','Energy and urges','Screens, feeds and quick rewards','Why can late nights be difficult?','What can I do when an urge appears?'];
Object.assign(ART,{'Energy and urges':['Extra energy can turn into restlessness and urges.','Poor sleep, long sitting and little exercise leave energy with nowhere to go.','When energy has an outlet, urges often feel weaker.','Do 20 push-ups, run, or take a fast walk when you feel restless.','Move your body first. Decide later.'],'Screens, feeds and quick rewards':['Feeds are built to keep you looking for the next hit.','Scrolling and gaming give quick rewards, and sexual content can sneak in.','The more you scroll, the stronger the pull to keep going.','Close the app, move your phone, and do something with your hands.','Remove the cue and the urge loses fuel.'],'Emotions and urges':['Urges often show up when feelings are heavy.','Stress, sadness and loneliness can push you toward quick comfort.','Naming the feeling makes it easier to handle.','Ask yourself: what do I need right now? Rest, warmth, company or a break?','Meet the feeling first. The urge often softens.'],'Hormones and urges':['Hormone levels shift across the month, and urges can shift with them.','Many people notice stronger urges, mood changes or lower energy at certain times.','Seeing the pattern helps you plan instead of feeling caught off guard.','Note your mood daily. On harder days, add a warm drink, rest and a gentle stretch.','Patterns are normal. Planning makes them easier.'],'Loneliness and comfort':['Wanting comfort is human.','Loneliness can make urges feel like the only comfort available.','Other comfort works too: warmth, connection and kindness toward yourself.','Message someone, wrap up in a blanket, or listen to a calming song.','Choose comfort that leaves you feeling good afterward.']});
Object.assign(ARI,{'Energy and urges':'⚡','Screens, feeds and quick rewards':'📱','Emotions and urges':'💭','Hormones and urges':'🌙','Loneliness and comfort':'🫶'});
Object.assign(QZ,{'Energy and urges':['What helps when you feel restless?',['Sitting still','Moving your body','Scrolling'],1,'Movement gives extra energy a way out.'],'Emotions and urges':['What should you do first?',['Notice the feeling','Ignore it','Judge yourself'],0,'Naming the feeling makes it easier to handle.'],'Hormones and urges':['Why track your mood?',['To see patterns','To judge yourself','No reason'],0,'Patterns let you plan ahead.']});
const STILLX=()=>G()==='Girl'?['Comfort break: warm drink',"S.u.act='Warm tea';go('timer');startTimer(300)"]:['Burn the energy: push-ups',"S.u.act='Push-ups';go('timer');startTimer(180)"];
const PL=()=>G()==='Girl'?'Before anything else, let us soften this. Notice how you are feeling, then breathe.':'Your body is full of energy right now. Let us slow it down before anything else.';
const GUIDE=()=>G()==='Girl'?['Soften your shoulders.','Let your jaw relax.','Feel your feet on the floor.','Rest a hand on your chest if you like.','Each breath out lets go a little.','You are safe. This will pass.']:['Unclench your jaw.','Drop your shoulders.','Feel your feet on the floor.','Let the energy settle in your chest.','Each breath out lowers the urge.','You are still in control.'];
const CH={lower:'That is how urges work. They peak, then fall. You just watched it happen.',same:'That is okay. A pause does not have to fix it. Next, change your surroundings.',higher:'Urges can spike before they fall. You stayed with it, which is the hard part. Next, change your surroundings.'};
function goPause(){S.u.total=0;S.u.left=0;S.u.run=false;S.u.chg=null;go('pause')}
function startP(){startTimer(S.pd)}
closeM();setDisc();go(S.pin&&S.ob?'lock':(S.ob?'home':'splash'));
(function(){try{const q=new URLSearchParams(location.search);if(!S.ob||S.pin)return;if(q.get('action')==='urge')startUrge();else if(TABS.includes(q.get('tab')))go(q.get('tab'))}catch(e){}})();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script></body></html>
